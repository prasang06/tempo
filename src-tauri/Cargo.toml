[package]
name = "tempo"
version = "0.1.0"
description = "A quiet Pomodoro timer and task list for the Linux desktop"
authors = ["Prasang"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: editing ~/.claude/settings.json keeps its key order.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Native right-click on overlays: ask the window manager for its own window menu
# (KWin's has "Keep Above Others"). Same versions Tauri already uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
